<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rt-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141524"/>
      <stop offset="55%" stop-color="#0C0D16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>
    <linearGradient id="rt-rim" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="rt-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 64) rotate(90) scale(52)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rt-bar-1" x1="36" y1="30" x2="36" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rt-bar-2" x1="64" y1="30" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="rt-bar-3" x1="92" y1="30" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rt-knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="rt-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#rt-bg)" stroke="url(#rt-rim)" stroke-width="1.5"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#rt-glow)"/>

  <!-- Three harmonic tuning channels -->
  <!-- Channel 1 -->
  <rect x="32" y="28" width="8" height="72" rx="4" fill="#1B1D30"/>
  <rect x="32" y="46" width="8" height="54" rx="4" fill="url(#rt-bar-1)"/>
  <g filter="url(#rt-soft-glow)">
    <rect x="27" y="34" width="18" height="22" rx="9" fill="url(#rt-knob)"/>
    <rect x="27.75" y="34.75" width="16.5" height="20.5" rx="8.25" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="32" y="44" width="8" height="2" rx="1" fill="#4F46E5"/>
  </g>

  <!-- Channel 2 -->
  <rect x="60" y="28" width="8" height="72" rx="4" fill="#1B1D30"/>
  <rect x="60" y="72" width="8" height="28" rx="4" fill="url(#rt-bar-2)"/>
  <g filter="url(#rt-soft-glow)">
    <rect x="55" y="60" width="18" height="22" rx="9" fill="url(#rt-knob)"/>
    <rect x="55.75" y="60.75" width="16.5" height="20.5" rx="8.25" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="60" y="70" width="8" height="2" rx="1" fill="#6366F1"/>
  </g>

  <!-- Channel 3 -->
  <rect x="88" y="28" width="8" height="72" rx="4" fill="#1B1D30"/>
  <rect x="88" y="54" width="8" height="46" rx="4" fill="url(#rt-bar-3)"/>
  <g filter="url(#rt-soft-glow)">
    <rect x="83" y="42" width="18" height="22" rx="9" fill="url(#rt-knob)"/>
    <rect x="83.75" y="42.75" width="16.5" height="20.5" rx="8.25" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="88" y="52" width="8" height="2" rx="1" fill="#7C3AED"/>
  </g>
</svg>
