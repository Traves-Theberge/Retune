    <radialGradient id="glow-r" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 200) rotate(90) scale(240 380)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
